[PANDUAN LANGKAH DEMI LANGKAH MENGUBAH ISI KOTAK / ITEM (.ITA)]
Contoh: Mengubah semua Green Herb di Desa Utama menjadi Chicago Typewriter.

Langkah 1: Ekstrak File .ITA
1. Buka ISO RE4 PS2 Anda dengan UltraISO.
2. Masuk ke folder map game, lalu cari berkas bernama 'r101.ita' (File item area Desa Utama).
3. Ekstrak file tersebut ke Desktop Anda.

Langkah 2: Trik Instan Replace Massal di HxD
1. Buka file 'r101.ita' menggunakan HxD Hex Editor.
2. Tekan tombol 'Ctrl + R' pada keyboard untuk membuka menu 'Replace' (Ganti).
3. Pada jendela popup yang muncul, pindahkan tab pencarian ke bagian 'Hex-values'.
4. Pada kolom 'Search for', ketik angka: 13 (Kode Green Herb).
5. Pada kolom 'Replace with', ketik angka: 24 (Kode Chicago Typewriter).
6. Klik tombol 'Replace All' di sebelah kanan. HxD akan otomatis mengubah seluruh Green Herb di map tersebut menjadi Chicago Typewriter secara instan.
7. Klik File > Save.

Langkah 3: Re-import & Test
1. Masukkan kembali file 'r101.ita' yang telah disimpan ke dalam ISO menggunakan UltraISO (menimpa file lama).
2. Simpan ISO tersebut.
3. Jalankan game di emulator PCSX2, masuk ke area desa, hancurkan kotak kayu atau lemari yang biasanya berisi tanaman hijau. Sekarang Anda akan langsung mendapatkan senjata Chicago Typewriter!

================================================================================
[ATURAN EMAS ANTI-CRASH (LIMITASI RAM PS2)]
1. PS2 memiliki kapasitas RAM yang sangat terbatas dibandingkan PC. Jangan pernah memasukkan kode musuh dari area Pulau/Kastil (seperti Regenerator '22') ke dalam file desa ('r100.esl' / 'r101.esl') secara mentah-mentah. Game akan langsung mengalami freeze/layar hitam karena data tekstur visualnya tidak dimuat di memori desa.
2. Jika ingin memodifikasi area desa, gunakan ID musuh faksi desa saja (01 s.d. 0B, dan 19) agar game berjalan 100% lancar tanpa hambatan!
