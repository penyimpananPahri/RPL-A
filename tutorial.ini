[PERSIAPAN_ALAT_DAN_TOOLS]
Berikut adalah software wajib yang harus diinstal di komputer/laptop Anda:
1. HxD Hex Editor -> Software gratis untuk mengedit kode hex (angka) di dalam file game.
2. UltraISO -> Untuk membuka file ISO RE4 PS2, mengekstrak file map, dan memasukkannya kembali.
3. PCSX2 Emulator -> Untuk menguji hasil modifikasi langsung di PC Anda tanpa harus membakar ke kaset.

================================================================================
[DAFTAR KODE HEX MUSUH (ENEMY ID)]
Masukkan kode ini pada Byte ke-0 (angka pertama) di blok data musuh pada file .ESL.

FAKSI DESA (Sangat aman untuk Area 1-1):
- 01 = Don Jose (Ganado pria dengan kapak/pisau)
- 02 = Don Esteban (Ganado pria bertopi memegang obor/sabit)
- 03 = Don Diego (Ganado pria tua berjenggot)
- 04 = Maria (Ganado wanita memakai celemek)
- 05 = Isabel (Ganado wanita memakai rompi cokelat)
- 06 = Dr. Salvador (Manusia berkantong karung pembawa Gergaji Mesin)
- 0B = Bella Sisters (Wanita gergaji mesin kembar - wajah diperban)
- 19 = Colmillos (Serigala/Anjing Desa yang terinfeksi Plagas)

FAKSI KASTIL (Peringatan: Rentan crash di desa jika VRAM tidak cukup):
- 11 = Zealot / Los Illuminados Jubah Hitam (Musuh Kastil biasa)
- 12 = Zealot / Los Illuminados Jubah Ungu
- 13 = Zealot / Los Illuminados Jubah Merah (Topeng Kambing)
- 15 = Garrador (Gladiator buta cakar besi)
- 16 = Garrador Armored (Baju besi penuh kebal peluru)
- 17 = Armadura (Baju zirah abad pertengahan bergerak)
- 18 = Novistador (Monster serangga terbang/bisa menghilang)

FAKSI PULAU & BOS:
- 1E = Soldier Ganado (Tentara Pulau biasa)
- 20 = J.J. / Commando (Tentara besar bawa tembakan Gatling Gun)
- 22 = Regenerator (Monster abu-abu pucat pengubah organ)
- 23 = Iron Maiden (Regenerator berduri)
- 0D = El Gigante (Raksasa pemukul pohon)
- 0F = Bitores Mendez (Lurah Desa berwujud monster lipan)

