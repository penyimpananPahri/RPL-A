[DAFTAR KODE HEX ITEM & SENJATA LEON (ITEM ID)]
Masukkan kode ini pada Byte ke-0 di blok data item pada file .ITA.

SENJATA SPESIAL & KUAT:
- 21 = Rocket Launcher (Infinite / Peluru Tak Terbatas)
- 24 = Chicago Typewriter (Senjata mesin Thompson Mafia)
- 2E = Handcannon (Magnum terkuat setelah upgrade penuh)
- 26 = P.R.L. 412 (Senjata laser pemusnah massal)
- 20 = Rocket Launcher (Sekali pakai)
