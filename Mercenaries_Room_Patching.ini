[MERCENARIES_ROOM_PATCHING_TUTORIAL]
; =========================================================================
; FILE PANDUAN: MERCENARIES ROOM PATCHING (RESIDENT EVIL 4 PS2)
; KHUSUS REGION: USA (SLUS-21134 / CRC: 94A53E58) - BISA UNTUK EUROPE (PAL)
; =========================================================================

[PREPARATION_TOOLS]
; Siapkan perangkat lunak berikut sebelum memulai modding:
Tool_1 = UltraISO / Apache (Untuk bongkar pasang file di dalam ISO PS2)
Tool_2 = HxD Hex Editor (Untuk mengubah kode pointer internal file)
Tool_3 = Emulator PCSX2 (Untuk menguji hasil modifikasi di komputer)
Tool_4 = File Mentah ISO Resident Evil 4 PS2

[CORE_CONCEPT]
; Mengapa teknik ini penting?
; RAM PS2 sangat terbatas. Mode cerita biasa (Main Story) hanya memuat aset musuh spesifik area.
; Dengan meminjam (patching) file peta dari mode "The Mercenaries", alokasi RAM PS2 akan dipaksa
; untuk membuka database besar yang mampu memuat musuh lintas faksi (Desa, Kastil, Pulau) sekaligus.
ID_Peta_Desa_Cerita_Utama = r101
ID_Peta_Desa_Mercenaries  = r400

[STEP_BY_STEP_GUIDE]
Langkah_1 = Buka file ISO RE4 PS2 menggunakan aplikasi UltraISO.
Langkah_2 = Masuk ke folder internal game (Cari folder bernama BIO4 atau DATA, lalu masuk ke folder STAGE).
Langkah_3 = Ekstrak (drag & drop) tiga file berikut dari UltraISO ke Desktop komputer Anda:
            - r400.esl  (Daftar posisi musuh Mercenaries)
            - r400.udas (Model 3D & Room Trigger Mercenaries)
            - r400.lit  (Sistem pencahayaan Mercenaries)
Langkah_4 = Lakukan RENAME (Ubah Nama) ketiga file tersebut di Desktop agar game cerita utama mengiranya sebagai area desa awal Leon:
            - r400.esl  ubah menjadi -> r101.esl
            - r400.udas ubah menjadi -> r101.udas
            - r400.lit  ubah menjadi -> r101.lit
Langkah_5 = Buka aplikasi HxD Hex Editor, lalu tarik file 'r101.udas' yang ada di Desktop ke dalam jendela HxD.
Langkah_6 = Tekan tombol 'Ctrl + R' pada keyboard untuk membuka menu Ganti Otomatis (Replace).
Langkah_7 = Pada jendela Replace, ubah tipe pencarian menjadi "Text-string" (bukan Hex-values).
Langkah_8 = Pada kolom 'Search for' ketik: r400
Langkah_9 = Pada kolom 'Replace with' ketik: r101
Langkah_10 = Klik tombol 'Replace All' (Ganti Semua). Nilai internal peta akan disinkronisasikan.
Langkah_11 = Klik menu File > Save di pojok kiri atas HxD untuk menyimpan perubahan pada r101.udas.
Langkah_12 = Buka kembali UltraISO yang menampilkan folder STAGE tadi, lalu masukkan ketiga file baru Anda (r101.esl, r101.udas, r101.lit) untuk MENIMPA file bawaan aslinya.
Langkah_13 = Klik ikon Disket di pojok kiri atas UltraISO untuk menyimpan (Save) ISO game baru Anda.

[ADVANCED_MODDING_INFO]
; Setelah berhasil melakukan patching, Anda sekarang bebas membuka file r101.esl di HxD
; dan menukar kode musuh desa tanpa takut game mengalami Black Screen / Crash.
ID_Safe_Cross_Spawn_Kastil = 11 (Zealot Jubah Hitam), 12 (Zealot Jubah Ungu), 15 (Garrador Cakar)
ID_Safe_Cross_Spawn_Pulau  = 1E (Militan), 20 (J.J Gatling Gun), 23 (Iron Maiden)

[NOTES_ANTI_CRASH]
Tip_1 = Selalu pastikan ukuran file .UDAS tidak berubah drastis setelah dilakukan text-replace.
Tip_2 = Gunakan emulator PCSX2 dengan fitur 'Enable Cheats' menyala jika Anda mengombinasikannya dengan file .pnach.
