[Tutorial_Stuck_Ammo_999]
Game_Target = Resident Evil 4 PS2 (Region USA - SLUS-21134)
File_Version = 1.0
Author = AI Assistant Modding Guide

[Deskripsi_Dasar]
Tutorial ini menjelaskan cara mengunci jumlah peluru senjata menjadi 999 (Infinite Ammo).
Di dalam sistem memori Resident Evil 4 PS2, angka desimal 999 diubah menjadi kode Hexadecimal: 03 E7.
Sistem penyimpanan peluru menggunakan format 2-Byte (Word).

================================================================================
METODE 1: MENGGUNAKAN FILE CHEAT .PNACH (PCSX2 Emulator - Sangat Direkomendasikan)
================================================================================
Metode ini adalah cara termudah dan paling aman karena mengunci memori peluru secara langsung 
saat game berjalan tanpa perlu merusak berkas ISO game asli Anda.

Langkah-Langkah:
1. Buka emulator PCSX2 Anda.
2. Jalankan game Resident Evil 4 USA. Lihat log PCSX2 dan cari kode CRC game Anda. 
   Untuk RE4 USA SLUS-21134, kode CRC-nya adalah: 94A53E58
3. Buat sebuah file teks baru di komputer Anda (klik kanan di desktop -> New -> Text Document).
4. Ubah nama file teks tersebut beserta ekstensinya menjadi: 94A53E58.pnach
   (Pastikan ekstensi .txt di belakangnya sudah hilang).
5. Buka file 94A53E58.pnach menggunakan Notepad, lalu salin dan tempel kode berikut:

// --- KODE CHEAT START ---
comment=Resident Evil 4 USA (Stuck Ammo 999)

// Mengunci Peluru Slot Senjata Utama (Semua Senjata Aktif) menjadi 999
patch=1,EE,202D304C,extended,00000000
patch=1,EE,20428B14,extended,000003E7

// Catatan: Kode pertama mematikan fungsi pengurangan peluru saat ditembak (No Decrement).
// Kode kedua memaksa nilai peluru yang tersisa di magazine menjadi 999 (03E7 Hex).
// --- KODE CHEAT END ---

6. Simpan file tersebut (File -> Save).
7. Pindahkan file 94A53E58.pnach ke dalam folder bernama "cheats" yang ada di direktori instalasi PCSX2 Anda.
8. Di menu utama emulator PCSX2, pastikan Anda mencentang opsi "Enable Cheats" sebelum memainkan game.

================================================================================
METODE 2: PENYUNTINGAN PERMANEN VIA HEX EDITOR HxD (.ITA / .ESL)
================================================================================
Jika Anda ingin membuat peluru di dalam koper bawaan Leon atau peluru yang terjatuh di map 
langsung berjumlah 999 secara permanen tanpa cheat pnach:

Langkah-Langkah:
1. Ekstrak file pengaturan item/peta (contoh: r101.ita untuk Desa Utama) dari ISO menggunakan UltraISO.
2. Buka file r101.ita menggunakan HxD Hex Editor.
3. Cari slot item peluru yang ingin Anda ubah strukturnya.
   Struktur data item dasar: [ID Item] [Jumlah/Kuantitas] [Model ID] [Koordinat XYZ]
4. Sebagai contoh, jika Anda menemukan peluru Handgun (ID: 01) yang biasanya memiliki kuantitas 15 butir (Hex: 0F):
   - Struktur aslinya di baris hex: 01 0F XX XX ...
5. Ubah byte Kuantitas (Byte kedua) dan tambahkan kapasitasnya menjadi format 2-byte jika file map mendukung, 
   atau ubah kapasitas maksimal peluru default di file eksekusi game (SLUS_211.34).
   *Catatan Penting*: Karena keterbatasan engine internal versi PS2, mengubah kuantitas peluru di file .ita melebihi batas 
   maksimal bawaan (seperti peluru handgun di atas 50 butir per satu slot item) dapat menyebabkan visual item 
   mengalami glitch atau tidak bisa dipungut ke dalam tas jika tas penuh. 
   Oleh karena itu, Metode 1 (.pnach) adalah pilihan terbaik komunitas karena langsung menembus limitasi engine game.

================================================================================
KODE REFERENSI HEX LAINNYA UNTUK MODIFIKASI ITEM PELURU
================================================================================
Berikut adalah ID item peluru yang bisa Anda kombinasikan di masa mendatang:
01 = Peluru Handgun
02 = Peluru Shotgun
03 = Peluru Rifle (Sniper)
04 = Peluru TMP
0F = Peluru Mine Thrower
1C = Peluru Magnum (Broken Butterfly / Handcannon)

Selamat mencoba! Jika Anda mengalami kendala saat emulator membaca file cheat .pnach Anda,
pastikan opsi "Enable Cheats" di PCSX2 sudah dalam keadaan aktif.