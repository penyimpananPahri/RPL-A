[PANDUAN LANGKAH DEMI LANGKAH MENGUBAH MUSUH (.ESL)]
Contoh: Mengubah Ganado Kapak pertama di Pondok Awal menjadi Dr. Salvador Gergaji.

Langkah 1: Ekstrak File Game
1. Buka software UltraISO, lalu klik File > Open dan pilih file ISO RE4 PS2 Anda.
2. Masuk ke folder 'BIO4' atau 'DATA' di dalam UltraISO.
3. Cari file bernama 'r100.esl' (file map pondok pertama kali Leon beraksi).
4. Klik kanan file 'r100.esl', lalu pilih 'Extract to...' dan simpan di Desktop komputer Anda.

Langkah 2: Mengedit di HxD Hex Editor
1. Buka aplikasi HxD Hex Editor.
2. Tarik (drag & drop) file 'r100.esl' dari Desktop ke dalam jendela HxD.
3. Perhatikan kolom alamat sebelah kiri (Offset). Cari baris offset sekitar '00000030' atau '00000040'.
4. Temukan pola byte data musuh pertama yang diawali angka '01' (ID Ganado) atau '02' (Senjata Kapak).
5. Ubah nilai '01' di paling depan blok tersebut menjadi '06' (ID Dr. Salvador). Angka akan berubah menjadi warna merah.
6. Ubah nilai senjata di sebelahnya menjadi '06' (ID Gergaji Mesin).
7. Klik menu File > Save pada HxD untuk menyimpan perubahan.

Langkah 3: Memasukkan Kembali ke ISO
1. Buka kembali aplikasi UltraISO yang menampilkan isi ISO RE4 tadi.
2. Pastikan Anda berada di folder tempat file 'r100.esl' asli berada.
3. Tarik file 'r100.esl' yang sudah Anda edit di Desktop ke dalam UltraISO untuk menimpa file yang lama.
4. Klik File > Save pada UltraISO. Proses update ISO akan berjalan beberapa saat.
5. Selesai! Mainkan ISO baru tersebut di PCSX2, tonton sinematik pondok pertama, dan nikmati pertarungan melawan Dr. Salvador sejak detik pertama game dimulai!

