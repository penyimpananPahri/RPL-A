[DAFTAR KODE HEX SENJATA MUSUH (WEAPON ID)]
Masukkan kode ini pada Byte ke-1 (setelah ID musuh) di file .ESL.
- 00 = Tangan Kosong (Mencekik/Memukul)
- 01 = Pisau Dapur
- 02 = Kapak Lempar
- 03 = Sabit / Arit
- 04 = Obor Api
- 05 = Dinamit
- 06 = Gergaji Mesin (Wajib untuk Dr. Salvador / Bella Sisters)
- 07 = Palu Besar (Khusus Zealot topeng kambing)
- 08 = Perisai Kayu / Besi
- 09 = Panah Otomatis (Crossbow berapi)

