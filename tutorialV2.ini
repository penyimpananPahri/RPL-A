[TUTORIAL_MODDING_RE4_PS2_V2]
; ==============================================================================
; PANDUAN LANJUTAN V2: CROSS-MAP SPWN (MEMASUKKAN MUSUH KASTIL KE DESA)
; KHUSUS UNTUK REGION: USA (SLUS-21134) - SANGAT DIREKOMENDASIKAN
; ==============================================================================

[PERSIAPAN_ALAT_DAN_FILE]
1. HxD Hex Editor  -> Software untuk mengedit nilai byte data game.
2. UltraISO        -> Software untuk membuka, mengekstrak, dan memasukkan kembali file ke ISO.
3. PCSX2 Emulator  -> Untuk menguji langsung hasil modifikasi di komputer.
4. File Target Desa: 'r101.esl' (File spawn musuh area Desa Utama).

[RAHASIA_ANTI_CRASH_CROSS_MAP]
Secara default, jika Anda langsung mengubah kode Ganado Desa (01) menjadi Zealot Kastil (11) di file 'r101.esl', game akan CRASH/BLANK karena VRAM PS2 tidak memuat data 3D Zealot di area desa. 

Untuk mengakalinya, kita harus melakukan teknik "Room Header Pointer Patch" atau menggunakan teknik "Model Borrowing". Namun, cara paling aman dan stabil untuk pemula tanpa merusak kestabilan map adalah dengan memotong/mengosongkan slot memori musuh desa lain agar RAM PS2 memiliki ruang untuk membaca ID musuh baru.

[LANGKAH_DEMI_LANGKAH_EKSEKUSI]

LANGKAH 1: MENGEKSTRAK FILE TARGET
1. Buka ISO RE4 PS2 (USA) menggunakan UltraISO.
2. Masuk ke folder 'BIO4' atau 'DATA' di dalam ISO.
3. Cari file bernama 'r101.esl' (Desa Utama) dan 'r200.esl' (Area Kastil Awal).
4. Ekstrak kedua file tersebut ke Desktop Anda.

LANGKAH 2: MEMBERSIHKAN SLOT MEMORI (MENCEGAH CRASH)
1. Buka file 'r101.esl' di aplikasi HxD.
2. Karena kita ingin memasukkan musuh berat dari Kastil, kita harus menghapus beberapa Ganado desa agar RAM tidak penuh.
3. Gunakan fitur Ctrl+R (Replace).
4. Pilih tab 'Hex-values'.
5. Cari angka '01 02' (Ganado kapak), lalu ubah beberapa menjadi '00 00' (Menghapus musuh). Lakukan ini pada 5 sampai 10 slot musuh di baris tengah file agar memori lega.

LANGKAH 3: MEMASUKKAN DATA MUSUH KASTIL (CROSS-MAP INJECTION)
1. Sekarang, cari slot musuh aktif yang tersisa (misal diawali kode '01' atau '02').
2. Struktur data musuh RE4 PS2 adalah 32-Byte (2 baris penuh di HxD).
3. Ubah Byte ke-0 (Angka paling depan di blok musuh tersebut) dengan ID Kastil pilihan Anda:
   * Ubah menjadi '11' -> Untuk memunculkan Zealot Jubah Hitam.
   * Ubah menjadi '15' -> Untuk memunculkan Garrador (Gladiator Cakar).
4. PENTING: Pada Byte ke-1 (ID Senjata), sesuaikan dengan senjata faksi kastil:
   * Jika Zealot (11) -> Ubah senjata menjadi '07' (Palu Besar) atau '08' (Perisai).
   * Jika Garrador (15) -> Ubah senjata menjadi '00' (Cakar bawaan tubuh).

LANGKAH 4: MENYELARASKAN DATA ANIMASI (THE SECRET STEP)
1. Agar musuh kastil tidak bergerak kaku atau nge-bug di desa, Anda perlu menyalin nilai status AI dari area asalnya.
2. Buka file 'r200.esl' (Kastil) di HxD sebagai referensi.
3. Lihat baris data musuh Zealot di file 'r200.esl' tersebut pada byte ke-2 hingga byte ke-3 (biasanya bernilai '00 01' atau '02 00' tergantung jenis AI-nya).
4. Salin (Copy) nilai byte ke-2 dan ke-3 dari Zealot kastil tersebut, lalu tempel (Paste/Overwrite) ke byte ke-2 dan ke-3 musuh yang Anda ubah di file 'r101.esl'.

LANGKAH 5: METODE REASSEMBLY ISO
1. Setelah selesai melakukan modifikasi, simpan file 'r101.esl' Anda di HxD (File -> Save).
2. Buka kembali program UltraISO yang berisi project ISO RE4 Anda.
3. Tarik file 'r101.esl' yang sudah diedit dari Desktop ke dalam folder semula di UltraISO untuk menimpa file bawaannya.
4. Klik ikon 'Save' di UltraISO untuk membangun ulang file ISO baru Anda.
5. Jalankan ISO hasil modifikasi tersebut di PCSX2, masuk ke area desa utama, dan selamat! Anda akan melihat pengikut sekte Kastil atau Garrador berjalan di area desa.

[KAMUS_REFERENSI_ID_HEX_KASTIL]
* ID Musuh: '11' | ID Senjata: '00' -> Zealot Tangan Kosong (Mencekik)
* ID Musuh: '11' | ID Senjata: '07' -> Zealot Palu Besar
* ID Musuh: '11' | ID Senjata: '08' -> Zealot Perisai Kayu
* ID Musuh: '12' | ID Senjata: '09' -> Zealot Jubah Ungu Panah Api
* ID Musuh: '13' | ID Senjata: '07' -> Pemimpin Sekte Bertopeng Kambing
* ID Musuh: '15' | ID Senjata: '00' -> Garrador Cakar Biasa
* ID Musuh: '16' | ID Senjata: '00' -> Armored Garrador (Kebal Peluru)

[REKOMENDASI_PENGEMBANGAN]
Jika Anda ingin membuat modifikasi berskala besar tanpa batasan RAM map tunggal, pelajari teknik 'Mercenaries Room Patching', di mana seluruh aset model musuh dari ketiga faksi (Desa, Kastil, Pulau) sudah dimuat sekaligus oleh game ke dalam satu memori bersama.